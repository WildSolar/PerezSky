[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perezsky"
version = "1.0.0"
description = "Perez (1993) all-weather sky radiance and luminance distribution on a discretised sky, with plane irradiance, horizon masking and Radiance export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Wild", email = "michael.wild@zhaw.ch" }]
keywords = ["solar energy", "sky model", "Perez", "diffuse irradiance", "photovoltaics", "daylighting", "Radiance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.25",
]

[project.urls]
Homepage = "https://github.com/WildSolar/PerezSky"
Repository = "https://github.com/WildSolar/PerezSky"
Issues = "https://github.com/WildSolar/PerezSky/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "matplotlib>=3.6", "pvlib>=0.10", "pandas>=1.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/perezsky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "radiance: tests that call the Radiance programs gendaylit/rtrace (skipped if Radiance is not found)",
]
